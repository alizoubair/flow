version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - REPOSITORY_URI=$(echo $ECR_REPOSITORY_URI | cut -d':' -f1)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image for ARM64...
      - docker buildx create --use
      - docker buildx build --platform linux/arm64 -t $REPOSITORY_URI:$IMAGE_TAG --load .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Image pushed to $REPOSITORY_URI:$IMAGE_TAG
